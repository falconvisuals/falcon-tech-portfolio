media:
  - name: project_images
    label: Project Thumbnails
    input: assets/images/projects
    output: /assets/images/projects
    rename: safe
    extensions: [jpg, jpeg, png, webp]

content:
  - name: portfolio_projects
    label: Portfolio Projects
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: ugc-ai
              label: UGC & AI Ads
            - name: paid-ads
              label: Paid Ads
            - name: high-end-reels
              label: High-End Reels
            - name: vsl
              label: VSLs
            - name: motion
              label: Motion
            - name: podcasts
              label: Podcasts
      - name: thumbnail
        label: Thumbnail
        type: image
        required: true
        description: Upload a JPG, PNG or WebP thumbnail. 1600×1000 or a similar landscape ratio works best.
        options:
          media: project_images
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: video_url
        label: Video URL
        type: string
        description: Paste a YouTube Unlisted link, Vimeo link, or a direct MP4/WebM URL. Leave blank to open only the thumbnail.
      - name: description
        label: Short Description
        type: text
        description: One short sentence about the project.
      - name: published
        label: Show on Website
        type: boolean
        default: true
