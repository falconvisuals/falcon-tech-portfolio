media:
  - name: portfolio_images
    label: Portfolio Images
    input: projects
    output: projects
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
    commit:
      templates:
        create: "Add portfolio image: {filename}"
        update: "Update portfolio image: {filename}"
        delete: "Remove portfolio image: {filename}"
        rename: "Rename portfolio image: {oldFilename} -> {newFilename}"

  - name: portfolio_thumbnails
    label: Portfolio Thumbnails
    input: thumbnails
    output: thumbnails
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: portfolio_projects
    label: Portfolio Projects
    type: file
    path: projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Project Title
        type: string
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          placeholder: Select a portfolio category
          values:
            - Artwork
            - Mascot
            - Text Base
            - Vector Art
            - Emotes
            - name: V-tuber
              label: V-Tuber

      - name: thumbnail
        label: Card Thumbnail (Optional)
        type: image
        required: false
        description: Optional lightweight card preview. If left empty, the first project image is used automatically.
        options:
          media: portfolio_thumbnails
          multiple: false
          unique: true
          categories: [image]
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: images
        label: Project Images
        type: image
        required: true
        description: Upload one or multiple full project images.
        options:
          media: portfolio_images
          path: uploads
          multiple: true
          unique: true
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

settings:
  hide: true
  commit:
    identity: user
    templates:
      update: "Update Falcon Visuals portfolio via Pages CMS"
